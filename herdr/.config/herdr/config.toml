onboarding = false

[keys]
prefix = "ctrl+i"

focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

split_horizontal = "prefix+h"
split_vertical = "prefix+v"

swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"

# navigate_pane_up = "up"
# navigate_pane_down = "down"
# navigate_workspace_up = "shift+up"
# navigate_workspace_down = "shift+down"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
selection_bg = "black"

[ui.toast]
delivery = "herdr"
